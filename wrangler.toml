#:schema node_modules/wrangler/config-schema.json
name = "colorworld"
main = "workers/api.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/cdn/*"]

# Optional bindings — uncomment ONLY after creating these resources in Cloudflare Dashboard.
# ColorWorld runs 100% live on Cloudflare Workers without requiring R2, KV, or D1 bindings:
# - Static catalog is served from src/data/catalog.json
# - Browser-direct R2 uploads in /admin use your R2 API keys configured in Admin Settings
# - /cdn/* and /api/* automatically fall back cleanly when unbound

# [[r2_buckets]]
# binding = "COLORING_BUCKET"
# bucket_name = "colorworld-assets"
# preview_bucket_name = "colorworld-assets-preview"

# [[kv_namespaces]]
# binding = "COLORING_KV"
# id = "YOUR_KV_NAMESPACE_ID"
# preview_id = "YOUR_PREVIEW_KV_ID"

# [[d1_databases]]
# binding = "DB"
# database_name = "colorworld-db"
# database_id = "YOUR_D1_DATABASE_ID"
